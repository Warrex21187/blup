; ==============================================================================
; Directive de mitigation recommandée par la PHP Security Team
; Rôle : Désactiver le mécanisme de suivi de progression d'upload dans les sessions
; pour éliminer le point d'entrée d'injection et de gestion d'état mémoire
; en attendant l'application du correctif sur le moteur PHP.
; ==============================================================================
session.upload_progress.enabled = 0

